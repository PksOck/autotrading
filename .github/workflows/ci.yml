name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: OpenAPI schema is up to date
        run: |
          uv run python -m preza.cli.export_openapi openapi.json
          git diff --exit-code openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: |
          pnpm i18n:check
          pnpm gen:api && git diff --exit-code lib/api/schema.d.ts
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: E2E
        working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps chromium
          (pnpm start &)
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
          pnpm exec playwright test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: POSTGRES_PASSWORD=x LITELLM_MASTER_KEY=y docker compose -f infra/docker-compose.yml config -q
