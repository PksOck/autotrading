name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: preza
          POSTGRES_PASSWORD: preza
          POSTGRES_DB: preza_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U preza -d preza_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://preza:preza@localhost:5432/preza_test
      TEST_DATABASE_URL: postgresql+asyncpg://preza:preza@localhost:5432/preza_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrations match models
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q
      - name: OpenAPI schema is up to date
        run: |
          uv run python -m preza.cli.export_openapi openapi.json
          git diff --exit-code openapi.json

  agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agents
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: preza
          POSTGRES_PASSWORD: preza
          POSTGRES_DB: preza_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U preza -d preza_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://preza:preza@localhost:5432/preza_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The whole TradingAgents graph on fixed snapshots with a scripted model (BL-086).
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: |
          pnpm i18n:check
          pnpm gen:api && git diff --exit-code lib/api/schema.d.ts
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: E2E
        working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps chromium
          (pnpm start &)
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
          pnpm exec playwright test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: POSTGRES_PASSWORD=x LITELLM_MASTER_KEY=y docker compose -f infra/docker-compose.yml config -q
