# LLM vloge (ADR-0004). Koda kliče samo imena vlog, nikoli ponudnikov.
# Modele zamenjaš v .env (LOCAL_MODEL, MINIMAX_MODEL) brez spremembe kode.

model_list:
  # --- lokalno (GPU naprava v LAN, Ollama) ---
  - model_name: embed
    litellm_params:
      model: os.environ/EMBED_MODEL
      api_base: os.environ/OLLAMA_BASE_URL

  - model_name: local-fast
    litellm_params:
      model: os.environ/LOCAL_MODEL # Qwen 3.8 27B, 4-bit
      api_base: os.environ/OLLAMA_BASE_URL
      think: false
      timeout: 120

  - model_name: local-reason
    litellm_params:
      model: os.environ/LOCAL_MODEL
      api_base: os.environ/OLLAMA_BASE_URL
      think: true
      timeout: 300

  # --- oblak: MiniMax (OpenAI-kompatibilen) ---
  # OpenCode Go sprejema samo klice iz OpenCode (glava x-opencode-session), zato ga
  # LiteLLM ne uporablja (BL-097). Obe oblačni vlogi gresta na MiniMax.
  # Structured calls keep response_format=json_schema plus prompt/local validation.
  # OpenAI-compatible parameter acceptance is not proof of MiniMax schema enforcement.
  # Thinking is not switched off: the deployed MiniMax-M3.1-Flash rejects
  # thinking=disabled (BL-168). Output budgets therefore include reasoning tokens.
  - model_name: cloud-quick
    litellm_params:
      model: os.environ/MINIMAX_MODEL
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      timeout: 300

  # globoke odločitve: posamezen korak debate traja tudi do ~7 min (BL-092)
  - model_name: cloud-deep
    litellm_params:
      model: os.environ/MINIMAX_MODEL
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      timeout: 600

router_settings:
  fallbacks:
    - cloud-deep: ["local-reason"]
    - cloud-quick: ["local-fast"]
    - local-fast: ["cloud-quick"]
  num_retries: 1
  # A timed-out or rejected call is not repeated: go straight to the fallback.
  retry_policy:
    TimeoutErrorRetries: 0
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0

litellm_settings:
  drop_params: true
  # Client deadline is CLIENT_TIMEOUT_SECONDS=540, leaving a 60 s margin.
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
