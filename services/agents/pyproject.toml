[project]
name = "preza-agents"
version = "0.1.0"
description = "Preža agents: deep analysis on TradingAgents with data from our database"
requires-python = ">=3.12,<3.13"
dependencies = [
  "preza-api",
  "tradingagents",
  "pandas>=3.0",
  "stockstats>=0.6.5",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "pandas-stubs>=2.2",
]

[tool.uv.sources]
preza-api = { path = "../api", editable = true }
# Pinned per ADR-0003: upgrade only after the regression snapshots pass (BL-086).
tradingagents = { git = "https://github.com/TauricResearch/TradingAgents", tag = "v0.7.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["preza_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["preza", "preza_agents", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["preza_agents"]

[[tool.mypy.overrides]]
module = ["tradingagents.*", "stockstats.*", "langchain_core.*", "yfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["db: needs TEST_DATABASE_URL (real Postgres)"]
